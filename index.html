<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="gambar/a.png">
<link rel="apple-touch-icon" href="gambar/a.png">
  <title>minemo</title>
  <style>
  body {
    background: #153400;
    margin: 0;
    min-height: 100vh;
    max-height: 100svh;
    overflow: hidden;
    touch-action: manipulation;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    text-align: center;
  }

  .judul h1 {
    margin: 0;
    font-size: clamp(28px, 6vw, 44px);
    color:rgb(rgb(10, 235, 243));
  }

  .pembuat {
    margin-top: 8px;
    font-size: clamp(12px, 3vw, 16px);
    opacity: 0.8;
  }

  .tombol {
    margin-top: 32px;
    padding: 12px 28px;
    border: 2px solid #fff;
    display: inline-block;
    cursor: pointer;
    border-radius: 8px;
    color:aquamarine
  }
  .ad-banner {
     position: fixed;
    bottom: 10px;
    left: 10px;
    background: #222;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
  }
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 18px;
    opacity: 0;
    transition: all 0.3s ease;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}
h1{
  color:yellowgreen;
}
p{
  color:cyan;
}
  </style>
</head>
<body>
  <div id="ad-banner" class="ad-banner">
  💰 Kirim THR Lewat DANA 😊 
  <a href="https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012092026032591680017"
  target="_blank"></a>
</div>
<div id="toast" class="toast"><</div>
  <div class="container">
    <div class="judul">
      <h1><b>I'm Minemo</b></h1>
    </div>

    <div class="pembuat">
      <p>di buat oleh bias...7 • 2026</p>
    </div>
    <div class="tombol" onclick="mulai()">PLAY</div>
    

  </div>
    <script>
     function mulai(){
      window.location.href ="Wajah.html";
     }
     const banner = document.getElementById("ad-banner");
const toast = document.getElementById("toast");

const link = "https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012092026032591680017";

banner.addEventListener("click", function(e) {

    if (e.target.tagName === "A") return;

    showToastAndRedirect("Terima kasih 🙏, membuka DANA...");
});
function showToastAndRedirect(text) {
    toast.innerText = text;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");

        window.open(link, "_blank");


    }, 2500);
}
   </script>
</body>
</html>
